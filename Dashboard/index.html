    <script>
    window.actualizarFechaUI = function() {
        const contenedor = document.getElementById("date");
        if (!contenedor) return;

        const meses = [
            "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
            "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
        ];

        const hoy = new Date();
        contenedor.textContent = `${hoy.getDate()} ${meses[hoy.getMonth()]} ${hoy.getFullYear()}`;
    };

    document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById("container-views");
        const links = document.querySelectorAll(".nav-links");

        // Función para cargar la vista HTML mediante fetch
        async function loadView(viewName) {
            try {
                const response = await fetch(`views/${viewName}`);
                
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: No se pudo encontrar views/${viewName}`);
                }
                
                const html = await response.text();
                container.innerHTML = html;

                // Se ejecuta la actualización de fecha tras inyectar la vista
                window.actualizarFechaUI();
            } catch (error) {
                console.error(error);
                container.innerHTML = `<p style="color:red;">Error al cargar la vista.</p>`;
            }
        }

        // Evento de clic para cada enlace del menú
        links.forEach(link => {
            link.addEventListener("click", (e) => {
                e.preventDefault(); // Evita que la página recargue o salte con el #
                
                const viewName = link.getAttribute("data-view");
                if (viewName) {
                    loadView(viewName);
                }
            });
        });

        // Vista default al cargar la página
        loadView("dashboard.html");
    });
</script>
